<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LocalDrop</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="/logo.png" alt="LocalDrop" class="logo" />
    </div>

    <div class="card">
      <h2>Send Files to PC</h2>
      <div class="drop-zone" id="dropZone">
        <p>Tap to select files</p>
        <input type="file" id="fileInput" multiple hidden />
      </div>
      <div id="selectedFiles" class="file-list"></div>
      <button class="btn btn-send" id="sendBtn">Send</button>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p id="sendStatus" class="status"></p>
    </div>

    <div class="card">
      <h2>Receive Files from PC</h2>
      <button class="btn btn-refresh" id="refreshBtn">Check for Files</button>
      <div id="fileListContainer" class="file-list"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
